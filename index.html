<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotflix - Movie Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --surface-color: #0d1322;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #ff6b00;
            --card-bg: #131b2e;
            --card-hover: #1c263d;
            --border-color: #1f293d;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #ff6b00;
            --card-bg: #e2e8f0;
            --card-hover: #cbd5e1;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8c00, #ff3b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .theme-toggle:hover {
            background: var(--card-hover);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        /* Horizontal Row for New Videos */
        .horizontal-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .movie-card {
            min-width: 140px;
            width: 140px;
            height: 200px;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .movie-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.2);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-hd {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* Grid for All Videos */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
        }

        .grid-card {
            aspect-ratio: 2/3;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .grid-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.2);
        }

        .grid-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--surface-color);
            width: 100%;
            max-width: 750px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .parts-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .part-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .part-btn:hover {
            border-color: var(--accent-color);
        }

        .part-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Topbar -->
    <div class="topbar">
        <div class="logo">Hotflix 🎬</div>
        <button class="theme-toggle" id="themeToggleBtn">🌙 Dark Mode</button>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- New Videos Section -->
        <section>
            <div class="section-title">New Videos</div>
            <div class="horizontal-scroll" id="newVideosRow">
                <div class="loading">Loading new videos...</div>
            </div>
        </section>

        <!-- All Videos Section -->
        <section>
            <div class="section-title">All Videos</div>
            <div class="grid-container" id="allVideosGrid">
                <div class="loading" style="grid-column: span 3;">Loading all videos...</div>
            </div>
        </section>

    </div>

    <!-- Video Modal / Player -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="video-container">
                <video id="mainVideoPlayer" controls autoplay></video>
            </div>
            <div class="modal-body">
                <div class="modal-header">
                    <div class="modal-title">Select Video Part</div>
                    <button class="close-btn" id="closeModalBtn">&times;</button>
                </div>
                <div class="parts-container" id="partsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_JSON_URL = "https://raw.githubusercontent.com/video3355/movie-vault-data/main/movies.json";
        
        const newVideosRow = document.getElementById('newVideosRow');
        const allVideosGrid = document.getElementById('allVideosGrid');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const videoModal = document.getElementById('videoModal');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const partsContainer = document.getElementById('partsContainer');

        // Theme Toggle
        themeToggleBtn.addEventListener('click', () => {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            if(currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '☀️ Light Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '🌙 Dark Mode';
            }
        });

        // Fetch Movies with Auto-Sanitizer & Referrer Bypass
        async function fetchMovies() {
            try {
                const response = await fetch(GITHUB_JSON_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                let text = await response.text();
                
                // Remove trailing commas before closing brackets/braces
                text = text.replace(/,\s*([\]}])/g, '$1');
                
                const data = JSON.parse(text);
                renderUI(data);
            } catch (error) {
                console.error("Error fetching movies:", error);
                newVideosRow.innerHTML = `<div class="loading" style="color: #ef4444;">Error: ${error.message}</div>`;
                allVideosGrid.innerHTML = `<div class="loading" style="color: #ef4444; grid-column: span 3;">Error: ${error.message}</div>`;
            }
        }

        function renderUI(movies) {
            // 1. New Videos (Last 10 uploaded in reverse)
            newVideosRow.innerHTML = '';
            const newVideos = [...movies].reverse().slice(0, 10);
            newVideos.forEach(movie => {
                const card = createMovieCard(movie, false);
                newVideosRow.appendChild(card);
            });

            // 2. All Videos (Randomized)
            allVideosGrid.innerHTML = '';
            const randomVideos = [...movies].sort(() => Math.random() - 0.5);
            randomVideos.forEach(movie => {
                const card = createMovieCard(movie, true);
                allVideosGrid.appendChild(card);
            });
        }

        function createMovieCard(movie, isGrid) {
            const card = document.createElement('div');
            card.className = isGrid ? 'grid-card' : 'movie-card';
            
            card.innerHTML = `
                <img src="${movie.tham}" alt="Thumbnail" referrerpolicy="no-referrer" crossorigin="anonymous" loading="lazy">
                <div class="badge-hd">HD</div>
            `;

            card.addEventListener('click', () => {
                openVideoModal(movie);
            });

            return card;
        }

        function openVideoModal(movie) {
            partsContainer.innerHTML = '';
            if(!movie.videos || movie.videos.length === 0) return;

            // Play first video part by default
            mainVideoPlayer.src = movie.videos[0];
            mainVideoPlayer.play();

            // Create buttons for parts
            movie.videos.forEach((videoUrl, index) => {
                const btn = document.createElement('button');
                btn.className = `part-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = `Part ${index + 1}`;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    mainVideoPlayer.src = videoUrl;
                    mainVideoPlayer.play();
                });

                partsContainer.appendChild(btn);
            });

            videoModal.style.display = 'flex';
        }

        closeModalBtn.addEventListener('click', () => {
            mainVideoPlayer.pause();
            mainVideoPlayer.src = '';
            videoModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if(e.target === videoModal) {
                mainVideoPlayer.pause();
                mainVideoPlayer.src = '';
                videoModal.style.display = 'none';
            }
        });

        // Initialize
        fetchMovies();
    </script>
</body>
</html>
